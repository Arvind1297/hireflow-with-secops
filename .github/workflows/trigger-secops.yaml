name: SecOps - Application Secret Scan

on:
  push:
    branches:
      - main

  repository_dispatch:
    types:
      - application_push

  workflow_dispatch:

jobs:
  receive-trigger:
    name: Verify and Scan Application
    runs-on: ubuntu-latest

    steps:
      - name: Display Trigger Information
        run: |
          echo "======================================"
          echo "SecOps Pipeline Started"
          echo "======================================"
          echo "Event: ${{ github.event_name }}"

          echo "Application Repository: ${{ github.event.client_payload.repository }}"
          echo "Application Branch: ${{ github.event.client_payload.branch }}"
          echo "Application Commit SHA: ${{ github.event.client_payload.commit_sha }}"

      - name: Checkout Application Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.client_payload.repository || github.repository }}
          ref: ${{ github.event.client_payload.commit_sha || github.sha }}
          path: application

      - name: Verify Checked Out Commit
        run: |
          echo "Application source checked out successfully."
          echo "Checked Out Commit SHA:"
          git -C application rev-parse HEAD

      - name: Scan for Application Secrets
        run: |
          echo "Starting Gitleaks Secret Scan..."

          docker run --rm \
            -v "${GITHUB_WORKSPACE}/application:/repo" \
            ghcr.io/gitleaks/gitleaks:latest \
            detect \
            --source=/repo \
            --no-git \
            --no-banner \
            --report-format=json \
            --report-path=/repo/gitleaks-report.json \
            --redact \
            --exit-code 1

      - name: Upload Gitleaks Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: application/gitleaks-report.json
          if-no-files-found: ignore